name: Flutter release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter config --enable-linux-desktop
      - run: sudo apt install libgtk-3-dev
      - run: flutter build linux --release
      - run: tar -czf strontianite-linux-x64.tar.gz -C build/linux/x64/release bundle
      - name: Parse version
        id: version_parser
        run: |
          TAG=${{ github.ref_name }}
          CLEAN_VERSION=${TAG#v}
          echo "clean=$CLEAN_VERSION" >> $GITHUB_OUTPUT
      - name: Upload builds to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}"
          draft: false
          make_latest: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/linux/x64/release/bundle
          body: >
            # Strontianite Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}